<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teyo • Clip do !so</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--lilas:#A970FF;--roxo:#6B3FD4;--grafite:#1b1b22;--azul:#3FA9F5}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  #cartao{position:fixed;left:var(--x,50%);bottom:var(--y,4%);width:min(calc(var(--tam,48) * 1vw),calc(var(--tam,48) * 1vh * 16 / 9));aspect-ratio:16/9;transform:translateX(var(--tx,-50%)) scale(.92);opacity:0;
    transition:opacity .45s,transform .45s;border-radius:18px;overflow:hidden;background:#000;border:3px solid var(--lilas);
    box-shadow:0 0 0 3px var(--grafite),0 12px 40px rgba(107,63,212,.55)}
  #cartao.on{opacity:1;transform:translateX(var(--tx,-50%)) scale(1)}
  video,iframe{width:100%;height:100%;border:0;object-fit:cover;background:#000;display:block}
  #nome{position:absolute;left:0;right:0;bottom:0;padding:14px 20px;color:#fff;font-weight:800;font-size:clamp(18px,2.4vw,34px);
    background:linear-gradient(transparent,rgba(27,27,34,.92));text-shadow:0 2px 6px #000}
  #nome small{display:block;font-weight:600;font-size:.55em;color:#cdb6ff}
  /* painel de entrada (aparece só quando falta o token; use "Interagir" no OBS) */
  #login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#1b1b22;color:#fff;text-align:center;padding:24px}
  #login button{background:var(--lilas);border:0;color:#fff;font-weight:700;font-size:18px;padding:12px 22px;border-radius:10px;cursor:pointer}
  #login p{max-width:520px;line-height:1.5;color:#cfc8e6}
  #status{position:fixed;left:8px;top:8px;font-size:12px;color:#cfc8e6;background:rgba(27,27,34,.8);padding:4px 8px;border-radius:6px;display:none}
</style>
</head>
<body>
<div id="cartao"><div id="media"></div><div id="nome"></div></div>
<div id="login">
  <div>
    <h2>🐺 Clip do !so</h2>
    <p>Falta autorizar o Twitch uma vez. No OBS: clique com o botão direito nesta fonte → <b>Interagir</b> → entre com a sua conta. O token fica salvo só neste navegador do OBS e serve apenas para buscar clips (nenhuma permissão de escrita).</p>
    <button id="entrar">Entrar com a Twitch</button>
  </div>
</div>
<div id="status"></div>
<script>
/* Parâmetros na URL: ?canal=teuzin0dev&max=20&teste=login&cid=SEU_CLIENT_ID&nivel=mod|vip|todos */
/* o redirect do Twitch está cadastrado com www; no domínio sem www o login se perde */
if (location.hostname === 'teuzin.com.br') location.replace('https://www.teuzin.com.br' + location.pathname + location.search + location.hash);
const Q = new URLSearchParams(location.search);
const CANAL = (Q.get('canal') || 'teuzin0dev').toLowerCase();
const CID = Q.get('cid') || 'bnqg3ttxcusgbv0z6dzgmjnln64gn9';
const MAXS = Math.max(5, Math.min(60, +Q.get('max') || 20));      // duração máxima na tela (s)
const NIVEL = Q.get('nivel') || 'mod';                             // quem pode usar o !so
const CMD = (Q.get('cmd') || '!so').toLowerCase();
document.documentElement.style.setProperty('--tam', Math.max(20, Math.min(100, +Q.get('tam') || 48)));
{ const pos = Q.get('pos') || 'centro', R = document.documentElement.style;
  if (pos === 'esq') { R.setProperty('--x', '2%'); R.setProperty('--tx', '0'); } else if (pos === 'dir') { R.setProperty('--x', '98%'); R.setProperty('--tx', '-100%'); } }
const WORKER = (Q.get('worker') || '').replace(/\/+$/, '');
const KTOK = 'teyo-soclip-token';
const REDIR = location.origin + location.pathname;

const $ = id => document.getElementById(id);
const st = t => { const e = $('status'); e.textContent = t; e.style.display = Q.has('debug') ? 'block' : 'none'; };
const ler = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ---- login (implicit flow, sem escopos) ---- */
function entrar() {
  const state = crypto.getRandomValues(new Uint32Array(4)).join('');
  gravar('teyo-soclip-state', state);
  location.href = 'https://id.twitch.tv/oauth2/authorize?' + new URLSearchParams({ client_id: CID, redirect_uri: REDIR, response_type: 'token', scope: '', state });
}
$('entrar').onclick = entrar;
(function voltou() {
  if (Q.get('error')) { const e = document.createElement('p'); e.style.color = '#ff8f8f'; e.textContent = 'Twitch recusou: ' + Q.get('error') + ' — ' + (Q.get('error_description') || ''); document.querySelector('#login div').appendChild(e); }
  if (!location.hash.includes('access_token')) return;
  const h = new URLSearchParams(location.hash.slice(1));
  // o fluxo implícito do Twitch não devolve expires_in: o prazo vem do /validate
  if (h.get('state') === ler('teyo-soclip-state')) gravar(KTOK, { t: h.get('access_token'), em: Date.now() + 3600e3 });
  history.replaceState(null, '', location.pathname + location.search);
})();
async function validar() {
  const k = ler(KTOK); if (!k) return;
  try {
    const r = await fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + k.t } });
    if (r.status === 401) { localStorage.removeItem(KTOK); return; }
    const j = await r.json();
    gravar(KTOK, { t: k.t, em: Date.now() + (j.expires_in || 3600) * 1000 });
  } catch {}
}
function token() { const k = ler(KTOK); return k && k.t && k.em > Date.now() + 60000 ? k.t : null; }

async function helix(path) {
  const r = await fetch('https://api.twitch.tv/helix/' + path, { headers: { 'Client-Id': CID, Authorization: 'Bearer ' + token() } });
  if (r.status === 401) { localStorage.removeItem(KTOK); $('login').style.display = 'flex'; throw new Error('token expirou'); }
  if (!r.ok) throw new Error('helix ' + r.status);
  return r.json();
}

/* ---- clips ---- */
async function clipAleatorio(login) {
  const u = (await helix('users?login=' + encodeURIComponent(login))).data[0];
  if (!u) return null;
  const c = (await helix('clips?broadcaster_id=' + u.id + '&first=100')).data;
  if (!c.length) return { u, clip: null };
  // prefere clips com mp4 direto (sem player do Twitch, sem aviso de conteúdo maduro e com som garantido)
  const diretos = WORKER ? c : c.filter(x => mp4De(x));
  const base = diretos.length ? diretos : c;
  const curtos = base.filter(x => x.duration <= MAXS + 5);
  const lista = curtos.length ? curtos : base;
  return { u, clip: lista[Math.floor(Math.random() * lista.length)] };
}
function mp4De(clip) {
  const t = clip.thumbnail_url || '';
  return /-preview-\d+x\d+\.jpg$/.test(t) ? t.replace(/-preview-\d+x\d+\.jpg$/, '.mp4') : null;
}

/* ---- tela ---- */
let fila = [], tocando = false, timer = null;
function fechar(fim) {
  clearTimeout(timer);
  $('cartao').classList.remove('on');
  setTimeout(() => { $('media').innerHTML = ''; tocando = false; fim && proximo(); }, 500);
}
function proximo() { if (tocando || !fila.length) return; tocando = true; tocar(fila.shift()); }
async function tocar(login) {
  try {
    const r = await clipAleatorio(login);
    if (!r || !r.clip) { tocando = false; st('sem clips: ' + login); return proximo(); }
    const { u, clip } = r;
    $('nome').innerHTML = '💜 ' + u.display_name.replace(/[<>&]/g, '') + '<small>' + clip.title.replace(/[<>&]/g, '') + '</small>';
    const m = $('media'); m.innerHTML = '';
    // o relógio só começa quando o clip realmente começa (carregar o vídeo leva alguns segundos)
    const armar = extra => { clearTimeout(timer); timer = setTimeout(() => fechar(true), (Math.min(MAXS, Math.ceil(clip.duration)) + extra) * 1000); };
    let embedado = false;
    const usarEmbed = () => {
      if (embedado) return; embedado = true;
      m.innerHTML = '';
      const f = document.createElement('iframe');
      f.allow = 'autoplay'; f.src = 'https://clips.twitch.tv/embed?clip=' + encodeURIComponent(clip.id) + '&parent=' + location.hostname + '&autoplay=true&muted=false&volume=1';
      f.onload = () => armar(4);
      m.appendChild(f);
    };
    let mp4 = mp4De(clip);
    if (WORKER) { try { const w = await (await fetch(WORKER + '/clip/' + encodeURIComponent(clip.id))).json(); if (w.url) mp4 = w.url; } catch {} }
    if (mp4) {
      const v = document.createElement('video');
      v.src = mp4; v.autoplay = true; v.playsInline = true; v.muted = false; v.volume = 1;
      v.onplaying = () => armar(2);
      v.onended = () => fechar(true);
      v.onerror = usarEmbed;
      m.appendChild(v);
      v.play().catch(usarEmbed);
      timer = setTimeout(usarEmbed, 8000); // se o mp4 não começar em 8 s, usa o player do Twitch
      v.onplaying = () => { clearTimeout(timer); armar(2); };
    } else usarEmbed();
    $('cartao').classList.add('on');
  } catch (e) { st(String(e)); tocando = false; setTimeout(proximo, 1000); }
}
function pedir(login) {
  login = login.replace(/^@/, '').toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!login || fila.includes(login)) return;
  fila.push(login); proximo();
}

/* ---- chat (IRC anônimo, só leitura) ---- */
function ouvir() {
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE'); ws.send('NICK justinfan' + Math.floor(Math.random() * 90000 + 10000));
    ws.send('JOIN #' + CANAL);
  };
  ws.onmessage = ev => ev.data.split('\r\n').filter(Boolean).forEach(l => {
    if (l.startsWith('PING')) return ws.send('PONG :tmi.twitch.tv');
    const m = l.match(/^@(\S+) :[^ ]+ PRIVMSG #\S+ :(.*)$/);
    if (!m) return;
    const tags = Object.fromEntries(m[1].split(';').map(p => p.split('=')));
    const badges = tags.badges || '';
    const ok = /broadcaster|moderator/.test(badges) || (NIVEL !== 'mod' && /vip/.test(badges)) || NIVEL === 'todos';
    const [cmd, alvo] = m[2].trim().split(/\s+/);
    if (ok && cmd.toLowerCase() === CMD && alvo) pedir(alvo);
  });
  ws.onclose = () => setTimeout(ouvir, 3000);
}

validar().then(() => { if (!token()) $('login').style.display = 'flex'; });
if (token()) { const e = $('status'); e.textContent = '✅ Conectado — aguardando !so no chat de #' + CANAL; e.style.display = 'block'; setTimeout(() => { e.style.display = Q.has('debug') ? 'block' : 'none'; }, 6000); }
ouvir();
if (Q.get('teste')) setTimeout(() => token() ? pedir(Q.get('teste')) : st('sem token'), 1500);
</script>
</body>
</html>
