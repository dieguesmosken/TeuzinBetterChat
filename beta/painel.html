<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TeuzinBetterChat - Painel (Kick)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--roxo:#7B2CF2;--lilas:#A970FF;--noite:#0e0820;--painel:#11111a;--texto:#f4eeff;--suave:#b9a8e0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--noite);color:var(--texto);font:15px/1.45 "Segoe UI",system-ui,sans-serif;padding:18px;min-height:100vh}
  .grade{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:340px 1fr;gap:18px}
  @media(max-width:820px){.grade{grid-template-columns:1fr}}
  .moldura{border:5px solid var(--roxo);border-radius:26px;background:var(--painel);padding:18px 20px;margin-bottom:18px}
  h1{font-size:20px;margin-bottom:4px} h1 span{color:var(--lilas)}
  h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--lilas);margin-bottom:10px}
  p.dica{color:var(--suave);font-size:12.5px;margin:6px 0}
  label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
  label small{font-weight:500;color:var(--suave)}
  input[type=text],textarea{width:100%;background:#0b0b12;border:2px solid #3a2470;border-radius:12px;color:#fff;padding:9px 12px;font:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--lilas)}
  textarea{resize:vertical;min-height:70px}
  button{background:linear-gradient(135deg,var(--roxo),var(--lilas));border:0;color:#fff;font:700 14px inherit;font-family:inherit;padding:9px 16px;border-radius:12px;cursor:pointer}
  button.sec{background:transparent;border:2px solid var(--lilas);color:var(--lilas)}
  button.perigo{background:#b3203a}
  button.mini{padding:3px 9px;font-size:12px;border-radius:8px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  #estado{font-weight:700}
  #estado.ok{color:#7dffb3} #estado.erro{color:#ff8a9a}
  #lista{display:flex;flex-direction:column;gap:6px;max-height:62vh;overflow:auto}
  .m{display:flex;gap:10px;align-items:flex-start;background:#0b0b12;border:1px solid #2d1a5c;border-left:5px solid var(--cor,var(--lilas));border-radius:10px;padding:7px 10px}
  .m .t{flex:1;min-width:0;overflow-wrap:anywhere}
  .m b{color:var(--cor,#fff)}
  .m .acoes{display:flex;gap:4px;flex-shrink:0}
  .m.apagada{opacity:.4;text-decoration:line-through}
  #aviso{color:#ffd37d;font-size:12.5px}
</style>
</head>
<body>
<div class="grade">
  <aside>
    <section class="moldura">
      <h1><span>Teuzin</span>BetterChat</h1>
      <p class="dica">Painel do dono do canal: enviar mensagens e moderar na Kick.</p>
      <h2>Conexão</h2>
      <label for="worker">Endereço do worker <small>(o servidor que guarda o segredo do app)</small></label>
      <input type="text" id="worker" placeholder="https://teuzinbetterchat-kick.SEU.workers.dev" autocomplete="off" spellcheck="false">
      <label for="cid">Client ID do app da Kick <small>(público)</small></label>
      <input type="text" id="cid" placeholder="cole o Client ID" autocomplete="off" spellcheck="false">
      <p class="dica">URL de redirecionamento do app: <b id="redir"></b></p>
      <div class="linha"><button id="entrar">Entrar com a Kick</button><button class="sec" id="sair" hidden>Sair</button></div>
      <p id="estado" class="dica">Sem login.</p>
    </section>
    <section class="moldura">
      <h2>Chat da sala</h2>
      <label for="sala">Número da sala <small>(o mesmo <code>kickid</code> do configurador)</small></label>
      <input type="text" id="sala" placeholder="ex.: 12345678" autocomplete="off" spellcheck="false">
      <label for="relay">Relay local <small>(o Kick só deixa programas, não navegadores, lerem o chat: rode <code>node relay.js --kick SEUCANAL</code>)</small></label>
      <input type="text" id="relay" placeholder="ws://localhost:8787" autocomplete="off" spellcheck="false">
      <div class="linha"><button class="sec" id="ouvir">Ouvir a sala</button></div>
    </section>
  </aside>
  <main>
    <section class="moldura">
      <h2>Enviar mensagem como você</h2>
      <textarea id="txt" maxlength="500" placeholder="escreva e envie para o chat da Kick" disabled></textarea>
      <div class="linha"><button id="enviar" disabled>Enviar</button><span id="envio" class="dica"></span></div>
    </section>
    <section class="moldura">
      <h2>Mensagens e moderação</h2>
      <p id="aviso">Entre com a Kick e ouça a sala para ver as mensagens com os botões de apagar, timeout e banir.</p>
      <div id="lista"></div>
    </section>
  </main>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const KS = 'teyo-painel-kick';       // configuracoes
  const KT = 'teyo-painel-kick-token'; // token (so neste navegador)
  const ESCOPOS = 'user:read channel:read chat:write moderation:ban moderation:chat_message:manage';
  const redir = location.href.replace(/[?#].*$/, '');
  $('redir').textContent = redir;
  const ler = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const gravar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  // Client ID publico do app da Kick do projeto (nao e segredo). O segredo fica so no worker.
  const CID_PADRAO = '01M64V54DJYW4HJP3VQ9CAFBYG';
  const cfg = Object.assign({ worker: '', cid: CID_PADRAO, sala: '', relay: 'ws://localhost:8787' }, ler(KS) || {});
  if (!cfg.cid) cfg.cid = CID_PADRAO;
  $('worker').value = cfg.worker; $('cid').value = cfg.cid; $('sala').value = cfg.sala; $('relay').value = cfg.relay;
  const salvarCfg = () => { cfg.worker = $('worker').value.trim().replace(/\/+$/, ''); cfg.cid = $('cid').value.trim(); cfg.sala = $('sala').value.trim(); cfg.relay = $('relay').value.trim(); gravar(KS, cfg); };
  ['worker', 'cid', 'sala', 'relay'].forEach(i => $(i).addEventListener('input', salvarCfg));

  const estado = (t, cl) => { $('estado').textContent = t; $('estado').className = 'dica ' + (cl || ''); $('estado').id = 'estado'; };

  // ---- PKCE ----
  const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const aleatorio = n => b64u(crypto.getRandomValues(new Uint8Array(n)));
  async function entrar() {
    salvarCfg();
    if (!cfg.worker || !cfg.cid) { estado('Preencha o endereço do worker e o Client ID.', 'erro'); return; }
    const verifier = aleatorio(48), state = aleatorio(16);
    const desafio = b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    try { sessionStorage.setItem('kick-pkce', JSON.stringify({ verifier, state })); } catch (e) {}
    location.href = 'https://id.kick.com/oauth/authorize?' + new URLSearchParams({ response_type: 'code', client_id: cfg.cid, redirect_uri: redir,
      scope: ESCOPOS, code_challenge: desafio, code_challenge_method: 'S256', state });
  }
  async function voltou() {
    const q = new URLSearchParams(location.search); const code = q.get('code'); if (!code) return;
    history.replaceState(null, '', location.pathname);
    let g = null; try { g = JSON.parse(sessionStorage.getItem('kick-pkce') || 'null'); sessionStorage.removeItem('kick-pkce'); } catch (e) {}
    if (!g || g.state !== q.get('state')) { estado('Login recusado: o "state" não confere. Tente de novo.', 'erro'); return; }
    try {
      const r = await fetch(cfg.worker + '/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, code_verifier: g.verifier, redirect_uri: redir }) });
      const j = await r.json(); if (!r.ok || !j.access_token) throw new Error(j.error_description || j.erro || j.error || 'falha ' + r.status);
      gravar(KT, { at: j.access_token, rt: j.refresh_token, ate: Date.now() + (j.expires_in || 3600) * 1000 - 60000 });
      await perfil();
    } catch (e) { estado('Não consegui entrar: ' + (e.message || e), 'erro'); }
  }
  async function token() {
    const t = ler(KT); if (!t) return null;
    if (Date.now() < t.ate) return t.at;
    try {
      const r = await fetch(cfg.worker + '/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: t.rt }) });
      const j = await r.json(); if (!r.ok || !j.access_token) throw 0;
      gravar(KT, { at: j.access_token, rt: j.refresh_token || t.rt, ate: Date.now() + (j.expires_in || 3600) * 1000 - 60000 });
      return j.access_token;
    } catch (e) { gravar(KT, null); estado('A sessão expirou. Entre de novo.', 'erro'); atualizar(); return null; }
  }
  async function api(metodo, caminho, corpo) {
    const at = await token(); if (!at) throw new Error('sem login');
    const r = await fetch(cfg.worker + '/api/' + caminho, { method: metodo, headers: { Authorization: 'Bearer ' + at, 'Content-Type': 'application/json' }, body: corpo ? JSON.stringify(corpo) : undefined });
    const t = await r.text(); let j = {}; try { j = JSON.parse(t); } catch (e) {}
    if (!r.ok) throw new Error((j.message || j.erro || j.error || 'erro ' + r.status));
    return j;
  }
  let eu = null;   // {id, slug}
  async function perfil() {
    try {
      const c = await api('GET', 'channels');
      const d = c.data && c.data[0]; if (!d) throw new Error('canal não encontrado');
      eu = { id: d.broadcaster_user_id, slug: d.slug };
      gravar(KS + '-eu', eu);
      estado('Conectado como ' + (d.slug || d.broadcaster_user_id) + ' ✓', 'ok');
    } catch (e) { estado('Login feito, mas não li o seu canal: ' + (e.message || e), 'erro'); }
    atualizar();
  }
  function atualizar() {
    const logado = !!ler(KT);
    $('entrar').hidden = logado; $('sair').hidden = !logado;
    $('txt').disabled = $('enviar').disabled = !logado || !eu;
    if (!logado) estado('Sem login.');
  }
  async function sair() {
    const t = ler(KT);
    if (t && cfg.worker) { try { await fetch(cfg.worker + '/revoke', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: t.at }) }); } catch (e) {} }
    gravar(KT, null); gravar(KS + '-eu', null); eu = null; atualizar();
  }

  // ---- enviar ----
  async function enviar() {
    const c = $('txt').value.trim(); if (!c || !eu) return;
    $('enviar').disabled = true; $('envio').textContent = 'enviando…';
    try {
      const j = await api('POST', 'chat', { broadcaster_user_id: Number(eu.id), content: c, type: 'user' });
      if (j.data && j.data.is_sent === false) throw new Error('a Kick não enviou');
      $('txt').value = ''; $('envio').textContent = 'enviado ✓';
    } catch (e) { $('envio').textContent = 'erro: ' + (e.message || e); }
    $('enviar').disabled = false; setTimeout(() => { $('envio').textContent = ''; }, 3000);
  }

  // ---- moderacao ----
  async function moderar(tipo, m, linha) {
    if (!eu) return;
    try {
      if (tipo === 'apagar') await api('DELETE', 'chat/' + encodeURIComponent(m.id));
      else if (tipo === 'timeout') await api('POST', 'moderation/bans', { broadcaster_user_id: Number(eu.id), user_id: Number(m.uid), duration: 10, reason: 'timeout pelo painel' });
      else if (tipo === 'banir') { if (!confirm('Banir ' + m.nome + '?')) return; await api('POST', 'moderation/bans', { broadcaster_user_id: Number(eu.id), user_id: Number(m.uid), reason: 'banido pelo painel' }); }
      linha.classList.add('apagada');
    } catch (e) { alert('Não deu: ' + (e.message || e)); }
  }
  function linhaMsg(m) {
    const d = document.createElement('div'); d.className = 'm'; d.dataset.mid = String(m.id || ''); d.style.setProperty('--cor', m.cor || '#A970FF');
    const t = document.createElement('div'); t.className = 't';
    const b = document.createElement('b'); b.textContent = m.nome; t.append(b, document.createTextNode(': ' + m.texto));
    const a = document.createElement('div'); a.className = 'acoes';
    [['apagar', 'Apagar', ''], ['timeout', '10 min', ''], ['banir', 'Banir', 'perigo']].forEach(([k, rot, cl]) => {
      const bt = document.createElement('button'); bt.className = 'mini sec ' + cl; bt.textContent = rot;
      bt.disabled = !eu; bt.addEventListener('click', () => moderar(k, m, d)); a.appendChild(bt);
    });
    d.append(t, a); return d;
  }

  // ---- ouvir a sala (WebSocket publico, o mesmo do chat) ----
  let ws, ouvindo = false;
  function ouvir() {
    salvarCfg(); if (!cfg.relay) { $('aviso').textContent = 'Informe o endereço do relay (ws://localhost:8787).'; return; }
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }
    try { ws = new WebSocket(cfg.relay); } catch (e) { $('aviso').textContent = 'Endereço do relay inválido.'; return; }
    ws.onopen = () => { $('aviso').textContent = 'Relay conectado ✓ — aguardando mensagens do Kick'; };
    ws.onmessage = ev => {
      let x; try { x = JSON.parse(ev.data); } catch (e) { return; }
      const l = $('lista');
      if (x.apagar) { l.querySelectorAll('[data-mid]').forEach(e => { if (e.dataset.mid === String(x.apagar)) e.remove(); }); return; }
      if (x.plat !== 'kick') return;
      l.appendChild(linhaMsg({ id: x.id, uid: x.uid, nome: x.nome || '?', cor: x.cor, texto: (x.partes || []).map(p => p.v || p.a || '').join('') || String(x.texto || '') }));
      while (l.children.length > 120) l.firstChild.remove(); l.scrollTop = l.scrollHeight;
    };
    ws.onclose = () => { $('aviso').textContent = 'Relay desligado ou não encontrado. Rode "node relay.js --kick SEUCANAL" no seu computador. Tentando de novo…'; setTimeout(ouvir, 4000); };
    ws.onerror = () => ws.close();
  }

  $('entrar').addEventListener('click', entrar); $('sair').addEventListener('click', sair);
  $('enviar').addEventListener('click', enviar); $('ouvir').addEventListener('click', ouvir);
  $('txt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });
  eu = ler(KS + '-eu');
  atualizar(); if (ler(KT) && eu) estado('Conectado como ' + (eu.slug || eu.id) + ' ✓', 'ok');
  voltou();
})();
</script>
</body>
</html>
