<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TeuzinBetterChat 2.0 beta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  TeuzinBetterChat 2.0 beta - widget de chat leve para OBS (Fonte de navegador)
  Conecta direto no chat da Twitch (leitura anonima por padrao) e, opcionalmente,
  junta Kick, YouTube e TikTok na mesma tela (multichat).

  Parametros na URL (todos opcionais):
    ?channel=teuzin0dev   canal
    &size=20              tamanho da fonte em px
    &max=25               maximo de mensagens na tela
    &fade=45              some depois de N segundos (0 = nunca)
    &hide=nightbot,streamelements,streamlabs,moobot,fossabot
                          contas ocultas (bots); &hide= (vazio) mostra todos os bots
    &pre=?fd,$pescar      esconde mensagens que COMECAM com esses textos (separe por virgula ou espaco)
    &cmds=0               1 = mostrar comandos que comecam com !
    &emote=1.0            tamanho dos emotes em "em"
    &ext=1                1 = emotes 7TV, BTTV e FFZ (padrao ligado; 0 desliga)
    &avatar=1             mostra a foto de perfil de quem fala
    &debug=1              mostra o nome tecnico de cada selo (para diagnostico)
    &demo=1               mensagens de teste (sem conectar)

  Multichat e login (opcionais):
    &channel=             (vazio) desliga a Twitch, util se so quiser outras plataformas
    &login=SEU_LOGIN&token=TOKEN   entra na Twitch autenticado (o token vale como senha!)
    &kick=canal&kickid=ID  chat da Kick (kickid = numero da sala; veja o configurador)
    &yt=ID_DO_VIDEO&ytkey=CHAVE   chat do YouTube (chave da YouTube Data API v3)
    &ytrt=TOKEN&worker=URL         chat do YouTube pelo login do Google (yt= vazio usa a live ativa)
    &ytint=6              segundos entre consultas do YouTube (minimo 3)
    &relay=ws://localhost:8787     recebe mensagens de um relay (ex.: TikTok, veja relay/)
    &plat=1               mostra o selo da plataforma em cada mensagem (automatico com 2+ fontes)
-->
<style>
  :root{
    --roxo:#7B2CF2; --lilas:#A970FF; --escuro:#150c2c; --noite:#0e0820;
    --texto:#f4eeff; --size:20px; --emote:1.5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;overflow:hidden}
  body{font-family:"Segoe UI","Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--texto);font-size:var(--size)}
  #chat{position:fixed;left:0;right:0;bottom:0;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;max-height:100%}
  .msg{
    position:relative;display:block;width:fit-content;max-width:100%;
    background:linear-gradient(135deg,rgba(21,12,44,.92),rgba(14,8,32,.88));
    border:1.5px solid rgba(169,112,255,.45);border-left:5px solid var(--cor,var(--lilas));
    border-radius:14px;padding:8px 14px 9px 12px;line-height:1.35;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    word-wrap:break-word;overflow-wrap:anywhere;
    animation:entra .35s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .msg.saindo{animation:sai .6s ease forwards}
  .msg.destaque{border-color:var(--lilas);background:linear-gradient(135deg,rgba(123,44,242,.55),rgba(21,12,44,.92))}
  @keyframes entra{from{opacity:0;transform:translateX(-26px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes sai{to{opacity:0;transform:translateY(-8px) scale(.97)}}
  .quem{font-weight:800;margin-right:.35em;white-space:nowrap}
  .quem::after{content:":";color:var(--lilas);font-weight:700;margin-left:1px}
  .badge{display:inline-block;font-size:.55em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    padding:.15em .5em;margin-right:.45em;border-radius:99px;vertical-align:.18em;color:#fff;background:var(--roxo)}
  .plat{display:inline-block;font-size:.5em;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:.2em .55em;margin-right:.45em;border-radius:6px;vertical-align:.25em;color:#fff}
  .plat.p-twitch{background:#9146ff}.plat.p-kick{background:#53fc18;color:#0b0b0b}.plat.p-youtube{background:#ff0033}.plat.p-tiktok{background:#111;box-shadow:inset 2px 0 #25f4ee,inset -2px 0 #fe2c55}
  .msg.p-kick{--plat:#53fc18}.msg.p-youtube{--plat:#ff0033}.msg.p-tiktok{--plat:#fe2c55}
  .badge.b-broadcaster{background:#e0245e}
  .badge.b-moderator{background:#1fae5b}
  .badge.b-vip{background:#d63cb7}
  .badge.b-subscriber{background:#a970ff}
  .badge.b-founder{background:#f0a020}
  .av{display:inline-block;width:1.7em;height:1.7em;border-radius:50%;vertical-align:middle;margin:-.2em .5em -.2em 0;
    background:var(--cor,var(--lilas));color:#150c2c;font-weight:800;font-size:.8em;text-align:center;line-height:1.7em;
    object-fit:cover;border:2px solid var(--cor,var(--lilas));overflow:hidden}
  img.bimg{height:1.05em;width:auto;vertical-align:-.15em;margin-right:.3em;border-radius:3px}
  .texto{display:inline}
  .texto img.emote{height:calc(1em * var(--emote));vertical-align:middle;margin:-.25em .06em}
  .acao .texto{font-style:italic;color:#e5d6ff}
  .msg.primeira::before{content:"✨ primeira mensagem";display:block;font-size:.55em;font-weight:700;color:var(--lilas);margin-bottom:2px}
  #status{position:fixed;top:6px;right:8px;font-size:12px;opacity:.0;transition:opacity .3s;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:8px}
  #status.on{opacity:.85}
</style>
</head>
<body>
<div id="chat"></div>
<div id="status"></div>

<script>
(() => {
  const P = new URLSearchParams(location.search);
  const CANAL = (P.get('channel') || 'teuzin0dev').toLowerCase().replace(/^#/, '');
  const MAX   = Math.max(3, parseInt(P.get('max') || '25', 10));
  const FADE  = Math.max(0, parseInt(P.get('fade') || '45', 10));
  const CMDS  = P.get('cmds') === '1';
  const PREFIXOS = (P.get('pre') || '').toLowerCase().split(/[\s,]+/).filter(Boolean);
  const DEMO  = P.get('demo') === '1';
  const EXT   = P.get('ext') !== '0';
  const DEBUG = P.get('debug') === '1';
  const AVATAR = P.get('avatar') === '1';
  const TW_ON = !(P.has('channel') && P.get('channel') === '');
  const TW_LOGIN = (P.get('login') || '').toLowerCase().replace(/^#/, '');
  const TW_TOKEN = (P.get('token') || '').replace(/^oauth:/, '');
  const KICK = (P.get('kick') || '').toLowerCase().trim();
  const KICKID = (P.get('kickid') || '').trim();
  const YT = (P.get('yt') || '').trim();
  const YTKEY = (P.get('ytkey') || '').trim();
  const YTRT = (P.get('ytrt') || '').trim();   // login do Google (refresh token); dispensa a chave de API
  const YTW = (P.get('worker') || 'https://teuzinbetterchat-kick.teuzin0dev.workers.dev').replace(/\/+$/, '');
  const YTINT = Math.max(3, parseFloat(P.get('ytint') || '6'));
  const RELAY = (P.get('relay') || '').trim();
  const FONTES = (TW_ON ? 1 : 0) + (KICK || KICKID ? 1 : 0) + ((YT && YTKEY) || YTRT ? 1 : 0) + (RELAY ? 1 : 0);
  const SHOWPLAT = P.get('plat') === '1' || FONTES > 1;
  const OCULTOS = new Set((P.has('hide') ? P.get('hide') :
    'nightbot,streamelements,streamlabs,moobot,fossabot,wizebot,sery_bot,soundalerts,commanderroot')
    .toLowerCase().split(',').map(s => s.trim()).filter(Boolean));
  document.documentElement.style.setProperty('--size', (P.get('size') || '20') + 'px');
  document.documentElement.style.setProperty('--emote', P.get('emote') || '1.5');

  const chat = document.getElementById('chat');
  const statusEl = document.getElementById('status');
  const setStatus = t => { statusEl.textContent = t; statusEl.classList.toggle('on', !!t); };

  // ---------- util ----------
  function corLegivel(hex, nome) {
    if (!/^#[0-9a-f]{6}$/i.test(hex || '')) {
      let h = 0; for (const c of nome) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return `hsl(${h % 360} 75% 68%)`;
    }
    let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const lum = (0.299*r + 0.587*g + 0.114*b);
    if (lum < 110) { const f = (140 - lum) / 255; r += (255-r)*f*1.6; g += (255-g)*f*1.6; b += (255-b)*f*1.6; }
    return `rgb(${Math.min(255,r|0)},${Math.min(255,g|0)},${Math.min(255,b|0)})`;
  }

  function parseTags(s) {
    const o = {};
    s.split(';').forEach(kv => { const i = kv.indexOf('='); if (i > 0) o[kv.slice(0,i)] = kv.slice(i+1); });
    return o;
  }
  const unesc = v => (v || '').replace(/\\s/g,' ').replace(/\\:/g,';').replace(/\\\\/g,'\\').replace(/\\r/g,'').replace(/\\n/g,' ');


  // ---------- APIs publicas (sem chave): selos oficiais + emotes 7TV/BTTV/FFZ ----------
  const selos = {};            // nome -> { versao -> url }
  const extEmotes = new Map(); // palavra -> url
  const jget = async u => { try { const r = await fetch(u); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  const https = u => (u || '').startsWith('//') ? 'https:' + u : u;

  function guardarSelos(j) {
    if (!j) return 0;
    let n = 0;
    const add = (nome, ver, url) => { if (!url) return; (selos[nome] = selos[nome] || {})[ver] = url; n++; };
    if (Array.isArray(j)) {                       // formato IVR
      j.forEach(set => (set.versions || []).forEach(v => add(set.setID || set.set_id, String(v.id), v.image_url_2x || v.image_url_1x || v.image_url_4x)));
    } else if (j.badge_sets) {                    // formato badges.twitch.tv
      Object.keys(j.badge_sets).forEach(nome => {
        const vs = j.badge_sets[nome].versions || {};
        Object.keys(vs).forEach(v => add(nome, v, vs[v].image_url_2x || vs[v].image_url_1x || vs[v].image_url_4x));
      });
    }
    return n;
  }
  async function baixarSelos(urlTwitch, urlIvr) {
    if (guardarSelos(await jget(urlTwitch))) return;
    guardarSelos(await jget(urlIvr));             // plano B
  }
  // fotos de perfil (API publica da IVR; plano B: decapi). Em cache por usuario.
  const avatarCache = new Map();
  function pegarAvatar(login) {
    if (!login) return Promise.resolve(null);
    if (!avatarCache.has(login)) avatarCache.set(login, (async () => {
      const j = await jget(`https://api.ivr.fi/v2/twitch/user?login=${encodeURIComponent(login)}`);
      const u = Array.isArray(j) ? j[0] : j;
      const url = u && (u.logo || u.profileImageURL);
      if (url) return url;
      try { const r = await fetch(`https://decapi.me/twitch/avatar/${encodeURIComponent(login)}`);
            const t = r.ok ? (await r.text()).trim() : ''; return /^https:\/\//.test(t) ? t : null; } catch (e) { return null; }
    })());
    return avatarCache.get(login);
  }
  function achaSelo(nome, versao) {
    const v = selos[nome]; if (!v) return null;
    if (v[versao]) return v[versao];
    // assinante: usa a versao de meses mais proxima abaixo
    const ks = Object.keys(v).map(Number).filter(n => !isNaN(n)).sort((a,b)=>a-b);
    let melhor = null; ks.forEach(k => { if (k <= Number(versao)) melhor = k; });
    return melhor !== null ? v[melhor] : (ks.length ? v[ks[0]] : null);
  }
  async function carregarGlobais() {
    await baixarSelos('https://badges.twitch.tv/v1/badges/global/display', 'https://api.ivr.fi/v2/twitch/badges/global');
    if (!EXT) return;
    const b = await jget('https://api.betterttv.net/3/cached/emotes/global');
    (b || []).forEach(e => extEmotes.set(e.code, `https://cdn.betterttv.net/emote/${e.id}/2x`));
    const t = await jget('https://7tv.io/v3/emote-sets/global');
    ((t && t.emotes) || []).forEach(e => extEmotes.set(e.name, `https://cdn.7tv.app/emote/${e.id}/2x.webp`));
    const f = await jget('https://api.frankerfacez.com/v1/set/global');
    if (f && f.sets) (f.default_sets || Object.keys(f.sets)).forEach(id => ((f.sets[id] || {}).emoticons || [])
      .forEach(e => extEmotes.set(e.name, https((e.urls['2'] || e.urls['1'])))));
  }
  let canalCarregado = null;
  let espera = Promise.resolve();
  const limite = p => Promise.race([p, new Promise(r => setTimeout(r, 3000))]);
  function infoDebug() { if (DEBUG) setStatus(`selos: ${Object.keys(selos).length} tipos | emotes ext: ${extEmotes.size}`); }
  function carregarCanal(id) {
    if (!id || canalCarregado === id) return; canalCarregado = id;
    espera = limite(Promise.all([espera, trabalhoCanal(id).then(infoDebug)]));
  }
  async function trabalhoCanal(id) {
    await baixarSelos(`https://badges.twitch.tv/v1/badges/channels/${id}/display`, `https://api.ivr.fi/v2/twitch/badges/channel?login=${CANAL}`);
    if (!EXT) return;
    const b = await jget(`https://api.betterttv.net/3/cached/users/twitch/${id}`);
    if (b) [].concat(b.channelEmotes || [], b.sharedEmotes || [])
      .forEach(e => extEmotes.set(e.code, `https://cdn.betterttv.net/emote/${e.id}/2x`));
    const t = await jget(`https://7tv.io/v3/users/twitch/${id}`);
    (((t && t.emote_set) || {}).emotes || []).forEach(e => extEmotes.set(e.name, `https://cdn.7tv.app/emote/${e.id}/2x.webp`));
    const f = await jget(`https://api.frankerfacez.com/v1/room/id/${id}`);
    if (f && f.sets) Object.keys(f.sets).forEach(k => (f.sets[k].emoticons || [])
      .forEach(e => extEmotes.set(e.name, https((e.urls['2'] || e.urls['1'])))));
  }

  // texto simples -> palavras, trocando as que forem emotes de terceiros
  function textoComExtras(el, txt) {
    if (!txt) return;
    if (!extEmotes.size) { el.appendChild(document.createTextNode(txt)); return; }
    let buf = '';
    txt.split(/(\s+)/).forEach(w => {
      const u = extEmotes.get(w);
      if (u) {
        if (buf) { el.appendChild(document.createTextNode(buf)); buf = ''; }
        const img = document.createElement('img');
        img.className = 'emote'; img.alt = w; img.src = u; img.referrerPolicy = 'no-referrer';
        el.appendChild(img);
      } else buf += w;
    });
    if (buf) el.appendChild(document.createTextNode(buf));
  }

  // monta o texto com emotes (posicoes do Twitch contam por caractere unicode)
  function construirTexto(el, texto, emotesTag) {
    const chars = Array.from(texto);
    const marcas = [];
    if (emotesTag) {
      emotesTag.split('/').forEach(grupo => {
        const [id, pos] = grupo.split(':');
        (pos || '').split(',').forEach(r => {
          const [a, b] = r.split('-').map(Number);
          if (!isNaN(a) && !isNaN(b)) marcas.push({ id, a, b });
        });
      });
      marcas.sort((x, y) => x.a - y.a);
    }
    let i = 0, buf = '';
    const flush = () => { if (buf) { textoComExtras(el, buf); buf = ''; } };
    for (const m of marcas) {
      while (i < m.a && i < chars.length) buf += chars[i++];
      flush();
      const img = document.createElement('img');
      img.className = 'emote';
      img.alt = chars.slice(m.a, m.b + 1).join('');
      img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${m.id}/default/dark/2.0`;
      img.referrerPolicy = 'no-referrer';
      el.appendChild(img);
      i = m.b + 1;
    }
    while (i < chars.length) buf += chars[i++];
    flush();
  }

  // texto ja dividido em pedacos: [{v:'oi '}, {e:'https://...png', a:'KEKW'}]
  function construirPartes(el, partes) {
    partes.forEach(p => {
      if (p.e) {
        const img = document.createElement('img');
        img.className = 'emote'; img.alt = p.a || ''; img.src = p.e; img.referrerPolicy = 'no-referrer';
        el.appendChild(img);
      } else if (p.v) el.appendChild(document.createTextNode(p.v));
    });
  }

  const BADGES = {
    broadcaster:['b-broadcaster','Dono'], moderator:['b-moderator','Mod'],
    vip:['b-vip','VIP'], subscriber:['b-subscriber','Sub'], founder:['b-founder','Fundador'],
    lead_moderator:['b-moderator','Lead Mod'], staff:['b-broadcaster','Staff'],
    artist_badge:['b-vip','Artista'], partner:['b-subscriber','Parceiro']
  };

  // ---------- render ----------
  function mostrar({ id, nome, login, cor, texto, emotes, badges, acao, primeira, destaque, plat = 'twitch', avatarUrl, partes }) {
    const m = document.createElement('div');
    m.className = 'msg p-' + plat + (acao ? ' acao' : '') + (primeira ? ' primeira' : '') + (destaque ? ' destaque' : '');
    m.dataset.id = id || '';
    m.dataset.login = login || '';
    m.style.setProperty('--cor', cor);
    if (SHOWPLAT) {
      const pl = document.createElement('span');
      pl.className = 'plat p-' + plat; pl.textContent = ({ twitch: 'Twitch', kick: 'Kick', youtube: 'YouTube', tiktok: 'TikTok' })[plat] || plat;
      m.appendChild(pl);
    }

    if (AVATAR) {
      const a = document.createElement('span');
      a.className = 'av'; a.textContent = (nome || '?').charAt(0).toUpperCase();
      m.appendChild(a);
      // 1) imagem direta (sem fetch/CORS, funciona em qualquer navegador); 2) plano B via API
      const poe = url => {
        const im = document.createElement('img');
        im.className = 'av'; im.alt = ''; im.referrerPolicy = 'no-referrer';
        im.onload = () => { if (a.isConnected) a.replaceWith(im); };
        im.onerror = () => { if (url.includes('unavatar')) pegarAvatar(login).then(u => { if (u) poe(u); }); };
        im.src = url;
      };
      if (avatarUrl) poe(avatarUrl);
      else if (plat === 'twitch') poe(`https://unavatar.io/twitch/${encodeURIComponent(login)}`);
    }
    (badges || '').split(',').filter(Boolean).forEach(b => {
      const [nomeB, ver] = b.split('/');
      const url = plat === 'twitch' ? achaSelo(nomeB, ver) : null;
      if (DEBUG) {
        const d = document.createElement('span');
        d.className = 'badge'; d.style.background = '#444'; d.textContent = nomeB + '/' + ver + (url ? ' ✓' : ' ✗');
        m.appendChild(d);
      }
      if (url) {
        const im = document.createElement('img');
        im.className = 'bimg'; im.alt = nomeB; im.src = url; im.referrerPolicy = 'no-referrer';
        m.appendChild(im);
      } else if (BADGES[nomeB]) {
        const s = document.createElement('span');
        s.className = 'badge ' + BADGES[nomeB][0];
        s.textContent = BADGES[nomeB][1];
        m.appendChild(s);
      }
    });

    const q = document.createElement('span');
    q.className = 'quem'; q.style.color = cor; q.textContent = nome;
    m.appendChild(q);

    const t = document.createElement('span');
    t.className = 'texto';
    if (partes) construirPartes(t, partes); else if (plat === 'twitch') construirTexto(t, texto, emotes); else t.appendChild(document.createTextNode(texto));
    m.appendChild(t);

    chat.appendChild(m);
    while (chat.children.length > MAX) chat.firstChild.remove();
    if (FADE > 0) setTimeout(() => remover(m), FADE * 1000);
  }
  function remover(m) {
    if (!m.isConnected) return;
    m.classList.add('saindo');
    setTimeout(() => m.remove(), 650);
  }

  // ---------- IRC ----------
  function tratarLinha(linha, ws) {
    if (linha.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); return; }
    let tags = {}, resto = linha;
    if (resto[0] === '@') { const sp = resto.indexOf(' '); tags = parseTags(resto.slice(1, sp)); resto = resto.slice(sp + 1); }
    const partes = resto.split(' ');
    const origem = partes[0], cmd = partes[1];

    if (tags['room-id'] && cmd === 'PRIVMSG') carregarCanal(tags['room-id']);
    if (cmd === 'PRIVMSG') {
      const login = (origem.match(/^:([^!]+)!/) || [])[1] || '';
      let texto = resto.slice(resto.indexOf(' :', resto.indexOf('PRIVMSG')) + 2);
      let acao = false;
      if (texto.startsWith('\u0001ACTION ')) { acao = true; texto = texto.slice(8).replace(/\u0001$/, ''); }
      if (OCULTOS.has(login)) return;
      if (!CMDS && texto.startsWith('!')) return;
      if (PREFIXOS.length && PREFIXOS.some(p => texto.toLowerCase().startsWith(p))) return;
      const nome = unesc(tags['display-name']) || login;
      espera.then(() => mostrar({
        id: tags['id'], login, nome, cor: corLegivel(tags['color'], login),
        texto, emotes: tags['emotes'], badges: tags['badges'], acao,
        primeira: tags['first-msg'] === '1',
        destaque: tags['msg-id'] === 'highlighted-message'
      }));
    } else if (cmd === 'USERNOTICE') {
      const sys = unesc(tags['system-msg']);
      const idx = resto.indexOf(' :', resto.indexOf('USERNOTICE'));
      const msg = idx > 0 ? resto.slice(idx + 2) : '';
      const login = tags['login'] || '';
      if (tags['msg-id'] === 'announcement') {
        if (OCULTOS.has(login)) return;
        espera.then(() => mostrar({ id: tags['id'], login, nome: unesc(tags['display-name']) || login,
          cor: corLegivel(tags['color'], login), texto: '📢 ' + msg, emotes: '', badges: tags['badges'], destaque: true }));
      } else if (sys) {
        espera.then(() => mostrar({ id: tags['id'], login, nome: '🎉', cor: '#A970FF',
          texto: sys + (msg ? ' — ' + msg : ''), emotes: '', badges: '', destaque: true }));
      }
    } else if (cmd === 'ROOMSTATE') {
      carregarCanal(tags['room-id']);
    } else if (cmd === 'CLEARMSG') {
      const alvo = tags['target-msg-id'];
      chat.querySelectorAll('.msg').forEach(e => { if (e.dataset.id === alvo) e.remove(); });
    } else if (cmd === 'CLEARCHAT') {
      const alvo = (resto.split(' :')[1] || '').trim().toLowerCase();
      if (alvo) chat.querySelectorAll('.msg').forEach(e => { if (e.dataset.login === alvo) e.remove(); });
      else chat.innerHTML = '';
    }
  }

  let atraso = 1000;
  function conectar() {
    setStatus('conectando ao chat…');
    const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      if (TW_TOKEN && TW_LOGIN) { ws.send('PASS oauth:' + TW_TOKEN); ws.send('NICK ' + TW_LOGIN); }   // autenticado
      else {
        ws.send('PASS SCHMOOCHIES');                       // login anonimo (somente leitura)
        ws.send('NICK justinfan' + (10000 + Math.floor(Math.random() * 89999)));
      }
      ws.send('JOIN #' + CANAL);
    };
    ws.onmessage = ev => {
      ev.data.split('\r\n').filter(Boolean).forEach(l => {
        if (l.includes(' 366 ')) { setStatus('conectado ✓'); atraso = 1000; setTimeout(() => setStatus(''), 2500); }
        tratarLinha(l, ws);
      });
    };
    const religar = () => { setStatus('reconectando…'); setTimeout(conectar, atraso); atraso = Math.min(atraso * 2, 15000); };
    ws.onclose = religar;
    ws.onerror = () => ws.close();
  }

  // ---------- filtros comuns (plataformas alem da Twitch) ----------
  function passa(login, texto) {
    if (OCULTOS.has((login || '').toLowerCase())) return false;
    if (!CMDS && texto.startsWith('!')) return false;
    if (PREFIXOS.length && PREFIXOS.some(p => texto.toLowerCase().startsWith(p))) return false;
    return true;
  }
  function reconectador(fn, rotulo) {
    let atrasoX = 1000;
    const rodar = () => fn(() => { atrasoX = 1000; }, () => { setStatus(rotulo + ': reconectando…'); setTimeout(rodar, atrasoX); atrasoX = Math.min(atrasoX * 2, 15000); });
    rodar();
  }

  // ---------- Kick (WebSocket publico da sala, via Pusher) ----------
  async function acharSalaKick() {
    if (KICKID) return KICKID;
    try {
      const r = await fetch('https://kick.com/api/v2/channels/' + encodeURIComponent(KICK));
      const j = await r.json();
      return String(j.chatroom && j.chatroom.id || '');
    } catch (e) { return ''; }
  }
  // Desde 13/10/2026 o Kick usa um sistema que recusa navegadores de outros sites (o Pusher foi desligado).
  // O chat do Kick agora chega pelo relay local: node relay.js --kick SEUCANAL  e  &relay=ws://localhost:8787
  function iniciarKick() {
    if (!RELAY) setStatus('Kick: precisa do relay local (veja relay/README) e do parâmetro &relay=');
  }
  function tratarKick(m) {
    const login = (m.sender && (m.sender.slug || m.sender.username) || '').toLowerCase();
    const nome = m.sender && m.sender.username || login;
    const texto = String(m.content || '');
    if (!passa(login, texto)) return;
    const idn = m.sender && m.sender.identity || {};
    const partes = []; const re = /\[emote:(\d+):([^\]]+)\]/g; let ult = 0, mm;
    while ((mm = re.exec(texto))) {
      if (mm.index > ult) partes.push({ v: texto.slice(ult, mm.index) });
      partes.push({ e: 'https://files.kick.com/emotes/' + mm[1] + '/fullsize', a: mm[2] });
      ult = re.lastIndex;
    }
    if (ult < texto.length) partes.push({ v: texto.slice(ult) });
    const tipos = (idn.badges || []).map(b => b.type).filter(t => BADGES[t]).map(t => t + '/1').join(',');
    espera.then(() => mostrar({ plat: 'kick', id: String(m.id || ''), login, nome, cor: corLegivel(idn.color, login),
      texto, partes, badges: tipos }));
  }

  // ---------- YouTube (YouTube Data API v3, consulta de tempos em tempos) ----------
  let ytAT = '', ytAte = 0;
  async function ytToken() {
    if (Date.now() < ytAte) return ytAT;
    const r = await fetch(YTW + '/yt/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: YTRT }) });
    const j = await r.json(); if (!r.ok || !j.access_token) throw new Error('login do Google expirou, entre de novo no configurador');
    ytAT = j.access_token; ytAte = Date.now() + (j.expires_in || 3600) * 1000 - 120000; return ytAT;
  }
  async function ytGet(url) {
    if (YTRT) return (await fetch(url, { headers: { Authorization: 'Bearer ' + await ytToken() } })).json();
    return (await fetch(url + '&key=' + encodeURIComponent(YTKEY))).json();
  }
  async function iniciarYouTube() {
    try {
      let chatId = '';
      if (YTRT && !YT) {   // sem ID de video: pega a live ativa do canal que fez login
        const j = await ytGet('https://www.googleapis.com/youtube/v3/liveBroadcasts?part=snippet&broadcastStatus=active&mine=true');
        if (j.error) throw new Error(j.error.message || 'erro');
        chatId = j.items && j.items[0] && j.items[0].snippet && j.items[0].snippet.liveChatId;
        if (!chatId) { setStatus('YouTube: nenhuma live ativa, tentando de novo…'); setTimeout(iniciarYouTube, 30000); return; }
      } else {
        const j = await ytGet('https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=' + encodeURIComponent(YT));
        if (j.error) throw new Error(j.error.message || 'erro');
        chatId = j.items && j.items[0] && j.items[0].liveStreamingDetails && j.items[0].liveStreamingDetails.activeLiveChatId;
        if (!chatId) { setStatus('YouTube: esse vídeo não tem chat ao vivo'); return; }
      }
      setStatus('YouTube conectado ✓'); setTimeout(() => setStatus(''), 2500);
      let token = '', primeira = true;
      const ciclo = async () => {
        let espera_ms = YTINT * 1000;
        try {
          const u = 'https://www.googleapis.com/youtube/v3/liveChat/messages?part=snippet,authorDetails&maxResults=200&liveChatId=' + encodeURIComponent(chatId) + (token ? '&pageToken=' + encodeURIComponent(token) : '');
          const d = await ytGet(u);
          if (d.error) throw new Error(d.error.message || 'erro');
          token = d.nextPageToken || token;
          espera_ms = Math.max(espera_ms, d.pollingIntervalMillis || 0);
          let itens = d.items || [];
          if (primeira) { itens = itens.slice(-5); primeira = false; }   // nao despeja o historico inteiro
          itens.forEach(tratarYouTube);
        } catch (e) { setStatus('YouTube: ' + (e.message || 'erro').slice(0, 60)); espera_ms = Math.max(espera_ms, 15000); }
        setTimeout(ciclo, espera_ms);
      };
      ciclo();
    } catch (e) { setStatus('YouTube: ' + (e.message || 'erro').slice(0, 60)); }
  }
  function tratarYouTube(it) {
    const a = it.authorDetails || {}, sn = it.snippet || {};
    const login = (a.channelId || a.displayName || '').toLowerCase();
    let texto = sn.displayMessage || (sn.textMessageDetails && sn.textMessageDetails.messageText) || '';
    let destaque = false;
    if (sn.type === 'superChatEvent' && sn.superChatDetails) { texto = '💰 ' + sn.superChatDetails.amountDisplayString + (sn.superChatDetails.userComment ? ' — ' + sn.superChatDetails.userComment : ''); destaque = true; }
    else if (sn.type === 'newSponsorEvent') { texto = '⭐ novo membro!'; destaque = true; }
    else if (sn.type !== 'textMessageEvent') { if (!texto) return; destaque = true; }
    if (!texto || !passa(a.displayName, texto)) return;
    const tipos = [a.isChatOwner ? 'broadcaster/1' : '', a.isChatModerator ? 'moderator/1' : '', a.isChatSponsor ? 'subscriber/1' : ''].filter(Boolean).join(',');
    espera.then(() => mostrar({ plat: 'youtube', id: it.id, login, nome: a.displayName || 'YouTube', cor: corLegivel('', a.displayName || 'yt'),
      texto, badges: tipos, destaque, avatarUrl: a.profileImageUrl }));
  }

  // ---------- Relay (TikTok e outras fontes que precisam de servidor) ----------
  function iniciarRelay() {
    reconectador((ok, cair) => {
      const ws = new WebSocket(RELAY);
      ws.onopen = () => { ok(); setStatus('relay conectado ✓'); setTimeout(() => setStatus(''), 2500); };
      ws.onmessage = ev => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.apagar) { chat.querySelectorAll('.msg').forEach(e => { if (e.dataset.id === String(m.apagar)) e.remove(); }); return; }
        const texto = String(m.texto || ''), login = String(m.login || m.nome || '').toLowerCase();
        if (!texto || !passa(login, texto)) return;
        const plat = ['twitch', 'kick', 'youtube', 'tiktok'].includes(m.plat) ? m.plat : 'tiktok';
        espera.then(() => mostrar({ plat, id: String(m.id || ''), login, nome: String(m.nome || login), cor: corLegivel(m.cor || '', login),
          texto, badges: String(m.badges || ''), destaque: !!m.destaque, avatarUrl: m.avatar, partes: Array.isArray(m.partes) ? m.partes : undefined }));
      };
      ws.onclose = cair; ws.onerror = () => ws.close();
    }, 'relay');
  }

  // ---------- demo ----------
  function demo() {
    const fala = [
      ['LoboAlfa','#9146FF','salve matilha! 🐺',''], ['Luna_BR','#FF69B4','que setup lindo!!',''],
      ['Rafa','#1E90FF','bora jogar Pokémon?',''], ['Mod_Teca','#2E8B57','lembrem de seguir o canal ❤',''],
      ['Visitante','#FF4500','primeira vez aqui, amei o chat','']
    ];
    let n = 0;
    const plats = SHOWPLAT ? ['twitch', 'kick', 'youtube', 'tiktok'] : ['twitch'];
    const tick = () => {
      const f = fala[n % fala.length]; n++;
      mostrar({ plat: plats[n % plats.length], id: 'd'+n, login: f[0].toLowerCase(), nome: f[0], cor: corLegivel(f[1], f[0]), texto: f[2],
        emotes: '', badges: n % 4 === 0 ? 'moderator/1' : (n % 3 === 0 ? 'subscriber/1' : (n === 1 ? 'broadcaster/1' : '')),
        acao: n === 6, primeira: n === 5, destaque: n === 7 });
    };
    for (let i = 0; i < 6; i++) tick();
    setInterval(tick, 2500);
  }

  espera = limite(carregarGlobais().then(infoDebug));
  if (DEMO) demo();
  else {
    if (TW_ON) conectar();
    if (KICK || KICKID) iniciarKick();
    if ((YT && YTKEY) || YTRT) iniciarYouTube();
    if (RELAY) iniciarRelay();
    if (!FONTES) setStatus('nenhuma fonte de chat configurada');
  }
})();
</script>
